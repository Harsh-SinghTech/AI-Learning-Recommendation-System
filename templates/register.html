{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-md-8">

            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">

                <div class="card-body p-5">

                    <!-- HEADER -->

                    <div class="text-center mb-4">

                        <div
                            style="
                            width:70px;
                            height:70px;
                            margin:auto;
                            border-radius:20px;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            background:linear-gradient(135deg,#5b4bff,#9b2cff);
                            color:white;
                            font-size:32px;
                            box-shadow:0 10px 25px rgba(91,75,255,.25);
                            "
                        >
                            ✦
                        </div>

                        <h2 class="fw-bold mt-4">
                            Create Your Account
                        </h2>

                        <p class="text-muted">
                            Start your personalized learning journey
                            with LearnAI.
                        </p>

                    </div>


                    <!-- FORM -->

                    <form method="POST">

                        <!-- FULL NAME -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Full Name
                            </label>

                            <input
                                type="text"
                                class="form-control form-control-lg rounded-3"
                                name="full_name"
                                placeholder="Enter your full name"
                                required>

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Email
                            </label>

                            <input
                                type="email"
                                class="form-control form-control-lg rounded-3"
                                name="email"
                                placeholder="Enter your email"
                                required>

                        </div>


                        <!-- PASSWORD -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control form-control-lg rounded-3"
                                name="password"
                                placeholder="Create a password"
                                required>

                        </div>


                        <!-- INTEREST -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Learning Interest
                            </label>

                            <select
                                class="form-select form-select-lg rounded-3"
                                name="interest">

                                <option>Machine Learning</option>
                                <option>Artificial Intelligence</option>
                                <option>Data Science</option>
                                <option>Web Development</option>
                                <option>Python</option>

                            </select>

                        </div>


                        <!-- SKILL LEVEL -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Skill Level
                            </label>

                            <select
                                class="form-select form-select-lg rounded-3"
                                name="skill_level">

                                <option>Beginner</option>
                                <option>Intermediate</option>
                                <option>Advanced</option>

                            </select>

                        </div>


                        <!-- REGISTER BUTTON -->

                        <button
                            type="submit"
                            class="btn btn-primary w-100 py-3 fw-bold"
                            style="
                            background:linear-gradient(90deg,#5146e5,#922cf5);
                            border:none;
                            border-radius:14px;
                            box-shadow:0 10px 25px rgba(92,55,230,.25);
                            "
                        >

                            Create Account →

                        </button>

                    </form>


                    <!-- LOGIN LINK -->

                    <p class="text-center mt-4 mb-0">

                        Already have an account?

                        <a
                            href="/login"
                            class="fw-semibold text-decoration-none"
                        >
                            Login

                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
