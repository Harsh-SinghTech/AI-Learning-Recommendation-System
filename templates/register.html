{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="card shadow-lg border-0 rounded-4 overflow-hidden"
     style="
     transition:.4s;
     border:none;
     ">

        <div class="row g-0">

            <!-- LEFT PANEL -->
            <div class="col-lg-4">

                <div class="h-100 d-flex flex-column justify-content-center align-items-center text-center text-white p-4"
                     style="background: linear-gradient(135deg,#6a5cff,#2b8cff); min-height:700px;">

                    <img src="{{ url_for('static', filename='images/hero.png') }}"
                         class="img-fluid mb-4"
                         style="max-width:220px;">

                    <h2 class="fw-bold">
                        Join Us Today!
                    </h2>

                    <p class="mt-3">
                        Create your account and unlock personalized AI learning
                        recommendations powered by Artificial Intelligence.
                    </p>

                </div>

            </div>

            <!-- RIGHT PANEL -->
            <div class="col-lg-8">

                <div class="card-body p-5">

                    <h2 class="text-center fw-bold mb-4">
                        Create Account
                    </h2>

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text"
                                   class="form-control"
                                   name="full_name"
                                   placeholder="Enter your full name"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email"
                                   class="form-control"
                                   name="email"
                                   placeholder="Enter your email"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password"
                                   class="form-control"
                                   name="password"
                                   placeholder="Create password"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Interest</label>

                            <select class="form-select" name="interest">

                                <option>Machine Learning</option>
                                <option>Artificial Intelligence</option>
                                <option>Data Science</option>
                                <option>Web Development</option>
                                <option>Python</option>

                            </select>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">Skill Level</label>

                            <select class="form-select" name="skill_level">

                                <option>Beginner</option>
                                <option>Intermediate</option>
                                <option>Advanced</option>

                            </select>

                        </div>

                        <button class="btn btn-primary w-100 py-2">
                            Register
                        </button>

                    </form>

                    <p class="text-center mt-4">

                        Already have an account?

                        <a href="/login">
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
